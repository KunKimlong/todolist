spring.application.name=todo
server.port=${PORT:8080}

# Local secrets (Brevo SMTP key, your email) go in backend/.env, which git ignores.
# See backend/.env.example. Real environment variables still take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/todo_db}
spring.datasource.username=${DB_USERNAME:todo}
spring.datasource.password=${DB_PASSWORD:todo}

# Schema is managed by Liquibase (src/main/resources/db/changelog); Hibernate only validates it
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Allowed origin pattern(s) for the Next.js frontend (comma separated, wildcards allowed)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# The single login account. APP_AUTH_EMAIL must be a real inbox: reset codes are sent there.
# APP_AUTH_PASSWORD is only used the first time the account is created; after that the
# password is stored (hashed) in the database and changed from Settings in the app.
app.auth.email=${APP_AUTH_EMAIL:me@example.com}
app.auth.password=${APP_AUTH_PASSWORD:changeme123}

# Sessions are stored in Redis (Spring Session), so they survive backend restarts
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6381}
spring.data.redis.password=${REDIS_PASSWORD:todo}
spring.session.data.redis.namespace=todo:session
# "indexed" lets us find a user's sessions (to sign out other devices after a password change)
spring.session.data.redis.repository-type=indexed

# The browser only gets an HttpOnly, SameSite=Lax cookie (no tokens); see SessionConfig
# Idle timeout: the session ends after this long without any request
spring.session.timeout=${SESSION_IDLE_TIMEOUT:30m}
# Absolute lifetime: sign in again this long after signing in, even if active
app.session.max-lifetime=${SESSION_MAX_LIFETIME:8h}
app.session.cookie-name=TODO_SESSION
# Set to true when served over HTTPS
app.session.cookie-secure=${SESSION_COOKIE_SECURE:false}

# Outgoing mail via Brevo SMTP (https://app.brevo.com > SMTP & API > SMTP)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Sender shown in the inbox; with Brevo this address must be a verified sender
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Tasks}

# One-time password reset codes
app.otp.ttl=10m
app.otp.resend-after=60s
app.otp.max-attempts=5
app.otp.max-per-hour=5
