databaseChangeLog:
  - changeSet:
      id: 001-create-todos-table
      author: todo-app
      # Databases created before Liquibase was introduced already have this table
      # (generated by Hibernate); in that case just record the changeset as applied.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: todos
      changes:
        - createTable:
            tableName: todos
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: todos_pkey
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: completed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: VARCHAR(10)
                  defaultValue: MEDIUM
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
              - column:
                  name: created_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE todos ADD CONSTRAINT todos_priority_check
              CHECK (priority IN ('LOW', 'MEDIUM', 'HIGH'))
      rollback:
        - dropTable:
            tableName: todos
