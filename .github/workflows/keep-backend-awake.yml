# Render's free web service sleeps after 15 minutes without traffic, and waking it
# takes about a minute (and logs people out). Pinging /health keeps it awake.
# GitHub may run scheduled jobs a few minutes late, hence every 5 minutes.
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health
        # A long timeout and retries so a ping that lands on a sleeping instance wakes it
        run: |
          curl --fail --silent --show-error --max-time 120 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               https://todolist-79fm.onrender.com/health
